[pytest]
testpaths = tests
# 讓 backend/ 進 sys.path，測試才 import 得到 api / models / pipeline / scripts。
# 不能只依賴「執行時的當前目錄剛好在 sys.path 裡」——`python -m pytest` 會把
# 當前目錄加進去，但裸 `pytest` 指令不會。CI 用的是後者，本機習慣用前者，
# 於是本機全綠、CI 全部 collection error（2026-09-08 實際踩到）。
pythonpath = .
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
addopts = -q --strict-markers
filterwarnings =
    ignore::DeprecationWarning
