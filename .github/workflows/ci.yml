name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend · lint + tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    # 06-auth-hardening.md M0：DB 測試地基需要真的 PostgreSQL，不是 SQLite
    # 代打——asyncpg、pgcrypto 的 gen_random_uuid()、UUID 欄位型別都是
    # postgres 專屬。GitHub Actions 的 job 本身就跑在 runner VM 上（不在
    # container 裡），所以 service 開的 port 直接映射到 localhost，
    # 不需要額外的 network 設定。
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: stockradar
          POSTGRES_PASSWORD: test
          POSTGRES_DB: stockradar_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U stockradar"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      DATABASE_URL: postgresql+asyncpg://stockradar:test@127.0.0.1:5432/stockradar_test
      SECRET_KEY: ci-test-only-secret-not-used-anywhere-else
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - run: pip install -r requirements-dev.txt

      # 只擋真正的錯誤（語法錯、未定義名稱、未使用 import），不擋排版風格。
      # 風格規則等有需要再開，一開始就全開只會讓 CI 變成噪音。
      - name: Ruff
        run: ruff check --select E9,F63,F7,F82,F401 .

      # migrations/env.py 讀的是 DATABASE_URL 環境變數（跟上面 job env 同一個），
      # 這一步同時證明了「alembic upgrade head 可以在乾淨的 DB 上從零建出
      # 完整 schema」——也是 01-backend.md Phase 1 的既有驗收標準之一。
      - name: Alembic upgrade head
        run: alembic upgrade head

      - name: Verify migration matches models exactly
        run: python scripts/verify_migration_schema.py

      - name: Pytest
        run: pytest --cov=. --cov-report=term-missing:skip-covered

  frontend:
    name: Frontend · typecheck + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # npm ci 而非 npm install：嚴格照 lockfile 安裝，build 才可重現
      - run: npm ci

      # build script 是 `tsc -b && vite build`，型別錯誤會直接讓這步失敗
      - run: npm run build

  docker:
    name: Docker · 兩個 image 都要 build 得起來
    runs-on: ubuntu-latest
    # 這個 job 的存在理由很具體：上線那天 backend image 因為 builder stage
    # 少裝 build-essential 而 build 失敗，是在 VPS 上跑了 8 分鐘才發現的。
    # 這裡兩分鐘就會擋下同一類問題。
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: false
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  compose:
    name: Compose · 設定檔可解析
    runs-on: ubuntu-latest
    # caddy 少了 environment 區塊而 crash loop，也是上線後才發現的。
    # config 驗證擋不掉那種語意問題，但能擋掉語法錯與變數漏設。
    steps:
      - uses: actions/checkout@v4

      - name: dev compose
        env:
          SECRET_KEY: ci-placeholder
          DB_PASSWORD: ci-placeholder
        run: docker compose -f docker-compose.yml config -q

      - name: prod compose
        env:
          SECRET_KEY: ci-placeholder
          DB_PASSWORD: ci-placeholder
          DOMAIN: example.com
          TLS_EMAIL: ci@example.com
        run: docker compose -f docker-compose.prod.yml config -q

      - name: 必填變數缺少時要擋下來
        run: |
          if docker compose --env-file /dev/null -f docker-compose.prod.yml config -q 2>/dev/null; then
            echo "::error::缺少 DOMAIN / SECRET_KEY 時 compose 應該要失敗"
            exit 1
          fi
          echo "OK：缺變數時 compose 正確拒絕"
