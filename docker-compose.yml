services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: stockradar
      POSTGRES_PASSWORD: ${DB_PASSWORD:-stockradar_dev_pw}
      POSTGRES_DB: stockradar
      TZ: Asia/Taipei
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stockradar"]
      interval: 10s
      retries: 5

  api:
    build: ./backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://stockradar:${DB_PASSWORD:-stockradar_dev_pw}@postgres:5432/stockradar
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-report@stockradar.tw}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      APP_ENV: ${APP_ENV:-development}
      TZ: Asia/Taipei
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./logs:/app/logs

  scheduler:
    build: ./backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://stockradar:${DB_PASSWORD:-stockradar_dev_pw}@postgres:5432/stockradar
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-report@stockradar.tw}
      TZ: Asia/Taipei
    volumes:
      - ./backend:/app
      - ./logs:/app/logs
    command: ["sh", "/app/scripts/cron_entry.sh"]

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - api

volumes:
  pg_data:
